[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanscope-backend"
version = "0.1.0"
description = "FastAPI backend serving OceanScope AI predictions and metrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "xarray>=2024.10.0",
    "zarr>=3.0.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "huggingface-hub>=0.20.0",
    "cachetools>=5.3.0",
    "slowapi>=0.1.9",
    "httpx>=0.27.0",
    "jsonschema>=4.17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "types-cachetools",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "xarray.*",
    "zarr.*",
    "pandas.*",
    "pyarrow.*",
    "huggingface_hub.*",
    "slowapi.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
