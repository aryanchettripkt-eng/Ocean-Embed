<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <defs>
    {/* Solar array cell pattern */}
    <linearGradient id="solarGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2F6B73"/>
      <stop offset="100%" stop-color="#14353B"/>
    </linearGradient>

    <linearGradient id="goldFoil" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2B66D"/>
      <stop offset="100%" stop-color="#CA774E"/>
    </linearGradient>

    {/* Radar beam gradient */}
    <linearGradient id="radarBeam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F2B66D" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#2F6B73" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2F6B73" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  {/* 1. Orbit Arc Trajectory (Dashed woodcut orbital path) */}
  <path d="M 10 35 Q 120 15 230 45" stroke="#1E2A2B" stroke-width="1.5" stroke-dasharray="6 5" fill="none" opacity="0.45"/>

  {/* 2. Earth Observation Scanning Beam (Translucent cone shining down) */}
  <polygon points="120,72 50,175 190,175" fill="url(#radarBeam)"/>
  <line x1="120" y1="72" x2="50" y2="175" stroke="#F2B66D" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="120" y1="72" x2="190" y2="175" stroke="#F2B66D" stroke-width="1.2" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="120" y1="72" x2="120" y2="175" stroke="#2F6B73" stroke-width="1" stroke-dasharray="2 3" opacity="0.4"/>

  {/* 3. Left Solar Array Wing */}
  <g transform="translate(25, 42)">
    {/* Solar panel frame */}
    <rect x="0" y="0" width="56" height="28" rx="2" fill="url(#solarGrad)" stroke="#1E2A2B" stroke-width="2"/>
    {/* Solar cells division grid */}
    <line x1="14" y1="0" x2="14" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="28" y1="0" x2="28" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="42" y1="0" x2="42" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="0" y1="14" x2="56" y2="14" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    {/* Yoke mounting boom */}
    <rect x="56" y="11" width="14" height="6" fill="#1E2A2B"/>
  </g>

  {/* 4. Right Solar Array Wing */}
  <g transform="translate(145, 42)">
    {/* Yoke mounting boom */}
    <rect x="0" y="11" width="14" height="6" fill="#1E2A2B"/>
    {/* Solar panel frame */}
    <rect x="14" y="0" width="56" height="28" rx="2" fill="url(#solarGrad)" stroke="#1E2A2B" stroke-width="2"/>
    {/* Solar cells division grid */}
    <line x1="28" y1="0" x2="28" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="42" y1="0" x2="42" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="56" y1="0" x2="56" y2="28" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
    <line x1="14" y1="14" x2="70" y2="14" stroke="#F2B66D" stroke-width="1" opacity="0.75"/>
  </g>

  {/* 5. Main Satellite Bus (Cube body in gold foil insulation) */}
  <g transform="translate(95, 30)">
    {/* Bus body */}
    <rect x="5" y="6" width="40" height="38" rx="3" fill="url(#goldFoil)" stroke="#1E2A2B" stroke-width="2.5"/>
    {/* Multi-layer insulation blanket pattern */}
    <line x1="5" y1="18" x2="45" y2="18" stroke="#1E2A2B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <line x1="5" y1="30" x2="45" y2="30" stroke="#1E2A2B" stroke-width="1" stroke-dasharray="2 2" opacity="0.6"/>
    <circle cx="25" cy="24" r="5" fill="#E4D8BA" stroke="#1E2A2B" stroke-width="1.5"/>

    {/* Top communication telemetry dish / boom */}
    <line x1="25" y1="6" x2="25" y2="-4" stroke="#1E2A2B" stroke-width="2"/>
    <circle cx="25" cy="-6" r="3" fill="#F2B66D" stroke="#1E2A2B" stroke-width="1.5"/>

    {/* Earth-Facing Radar Altimeter & Radiometer Horns (Bottom) */}
    {/* Radar Dish */}
    <path d="M 12 44 Q 25 54 38 44 Z" fill="#E4D8BA" stroke="#1E2A2B" stroke-width="2"/>
    <line x1="25" y1="44" x2="25" y2="52" stroke="#1E2A2B" stroke-width="2"/>
    {/* Radiometer sensor pod */}
    <rect x="21" y="52" width="8" height="6" rx="1" fill="#1E2A2B"/>
  </g>
</svg>