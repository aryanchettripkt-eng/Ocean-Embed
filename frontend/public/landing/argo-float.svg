<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 280" width="100" height="280">
  <defs>
    <linearGradient id="floatHullGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1F4E57"/>
      <stop offset="35%" stop-color="#2F6B73"/>
      <stop offset="70%" stop-color="#3B7D86"/>
      <stop offset="100%" stop-color="#14353B"/>
    </linearGradient>

    <linearGradient id="amberCollar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#CA774E"/>
      <stop offset="30%" stop-color="#F2B66D"/>
      <stop offset="75%" stop-color="#F6CA8D"/>
      <stop offset="100%" stop-color="#CA774E"/>
    </linearGradient>

    <linearGradient id="bladderGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E2A2B"/>
      <stop offset="100%" stop-color="#0B1D20"/>
    </linearGradient>
  </defs>

  {/* 1. ARGOS / Iridium Satellite Communication Antenna (Top) */}
  <line x1="50" y1="12" x2="50" y2="60" stroke="#1E2A2B" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="50" cy="10" r="3" fill="#F2B66D" stroke="#1E2A2B" stroke-width="1.5"/>
  <line x1="42" y1="24" x2="58" y2="24" stroke="#1E2A2B" stroke-width="1.5"/>

  {/* 2. CTD Sensor Head (Conductivity-Temperature-Depth sensor) */}
  <g transform="translate(38, 56)">
    {/* Sensor cylinder base */}
    <rect x="0" y="4" width="24" height="14" rx="2" fill="#E4D8BA" stroke="#1E2A2B" stroke-width="2"/>
    {/* Dual intake & conductivity cell ports */}
    <circle cx="7" cy="11" r="2.5" fill="#1E2A2B"/>
    <circle cx="17" cy="11" r="2.5" fill="#1E2A2B"/>
    {/* Flow tube */}
    <path d="M 7 11 L 7 0 C 7 -4 17 -4 17 0 L 17 11" fill="none" stroke="#1E2A2B" stroke-width="1.8"/>
  </g>

  {/* 3. Safety Flotation Collar (High-Visibility Amber) */}
  <g transform="translate(26, 72)">
    <rect x="0" y="0" width="48" height="26" rx="6" fill="url(#amberCollar)" stroke="#1E2A2B" stroke-width="2.5"/>
    {/* Collar rib bands */}
    <line x1="0" y1="9" x2="48" y2="9" stroke="#1E2A2B" stroke-width="1.5"/>
    <line x1="0" y1="17" x2="48" y2="17" stroke="#1E2A2B" stroke-width="1.5"/>
    {/* Lift bail handle */}
    <path d="M 12 0 C 12 -8 36 -8 36 0" fill="none" stroke="#1E2A2B" stroke-width="2"/>
  </g>

  {/* 4. Damping Disk (Hydrodynamic Stability Ring) */}
  <rect x="18" y="98" width="64" height="6" rx="2" fill="#E4D8BA" stroke="#1E2A2B" stroke-width="2"/>
  {/* Perforated stabilization holes */}
  <circle cx="28" cy="101" r="1.5" fill="#1E2A2B"/>
  <circle cx="72" cy="101" r="1.5" fill="#1E2A2B"/>

  {/* 5. Main Pressure Hull (Deep Aluminum Cylinder, 2000m Rated) */}
  <g transform="translate(33, 104)">
    <rect x="0" y="0" width="34" height="126" rx="3" fill="url(#floatHullGrad)" stroke="#1E2A2B" stroke-width="2.5"/>

    {/* Calibrated Depth Graduation Ticks */}
    <g stroke="#E4D8BA" stroke-width="1.5" opacity="0.8">
      {/* 0m Surface Mark */}
      <line x1="2" y1="15" x2="10" y2="15"/>
      {/* 500m Mark */}
      <line x1="2" y1="42" x2="14" y2="42" stroke-width="2"/>
      <line x1="2" y1="52" x2="8" y2="52"/>
      {/* 1000m Mark */}
      <line x1="2" y1="72" x2="16" y2="72" stroke-width="2"/>
      <line x1="2" y1="82" x2="8" y2="82"/>
      {/* 1500m Mark */}
      <line x1="2" y1="98" x2="12" y2="98"/>
      {/* 2000m Abyssal Mark */}
      <line x1="2" y1="114" x2="16" y2="114" stroke-width="2"/>
    </g>

    {/* Identification Code Stencil */}
    <text x="18" y="65" font-family="monospace" font-size="7" font-weight="bold" fill="#F6F1E2" transform="rotate(90, 18, 65)" letter-spacing="1">ARGO-NIO</text>
  </g>

  {/* 6. External Hydraulic Bladder (Buoyancy Engine, Bottom) */}
  <g transform="translate(36, 230)">
    {/* Lower hull endcap */}
    <path d="M 0 0 L 28 0 L 24 10 L 4 10 Z" fill="#1E2A2B"/>
    {/* Inflated rubber reservoir bladder */}
    <path d="M 4 10 C 2 24 26 24 24 10 Z" fill="url(#bladderGrad)" stroke="#1E2A2B" stroke-width="2"/>
    {/* Protective cage ring */}
    <path d="M 2 16 C 8 28 20 28 26 16" fill="none" stroke="#F2B66D" stroke-width="1.5" stroke-dasharray="3 3"/>
  </g>

  {/* 7. Subsurface Waterline Capillary Ripples */}
  <g stroke="#F6F1E2" stroke-width="1.8" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 12 76 C 20 73 24 77 30 76"/>
    <path d="M 70 76 C 76 75 80 77 88 76"/>
    <path d="M 6 82 C 16 80 20 84 26 82" opacity="0.6"/>
    <path d="M 74 82 C 80 81 84 83 94 82" opacity="0.6"/>
  </g>
</svg>