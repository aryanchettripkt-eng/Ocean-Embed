name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  filter:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ml:
              - 'ml/**'
              - 'fixtures/**'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - 'fixtures/**'
              - 'ml/src/oceanscope_ml/schemas/manifest.schema.json'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - 'backend/openapi.json'
              - '.github/workflows/ci.yml'

  ml:
    name: ML Checks
    needs: filter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.filter.outputs.ml == 'true' }}

      - name: Set up Python 3.11
        if: ${{ needs.filter.outputs.ml == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: ${{ needs.filter.outputs.ml == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        if: ${{ needs.filter.outputs.ml == 'true' }}
        run: ruff check .

      - name: Run Ruff Format Check
        if: ${{ needs.filter.outputs.ml == 'true' }}
        run: ruff format --check .

      - name: Run Mypy
        if: ${{ needs.filter.outputs.ml == 'true' }}
        run: mypy src

      - name: Run Pytest
        if: ${{ needs.filter.outputs.ml == 'true' }}
        run: pytest -q

  backend:
    name: Backend Checks
    needs: filter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.filter.outputs.backend == 'true' }}

      - name: Set up Python 3.11
        if: ${{ needs.filter.outputs.backend == 'true' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: ruff check .

      - name: Run Ruff Format Check
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: ruff format --check .

      - name: Run Mypy
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: mypy app

      - name: Verify Manifest Schema Parity
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: diff -u ../ml/src/oceanscope_ml/schemas/manifest.schema.json app/schemas/manifest.schema.json

      - name: Run Pytest
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: pytest -q

      - name: Verify OpenAPI Specification Up-to-Date
        if: ${{ needs.filter.outputs.backend == 'true' }}
        run: python -m app.export_openapi --check

  frontend:
    name: Frontend Checks
    needs: filter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        if: ${{ needs.filter.outputs.frontend == 'true' }}

      - name: Set up pnpm
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js 20
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          cache-dependency-path: "frontend/pnpm-lock.yaml"

      - name: Install dependencies
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        run: pnpm typecheck

      - name: Lint
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        run: pnpm lint

      - name: Test
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        run: pnpm test

      - name: Build
        if: ${{ needs.filter.outputs.frontend == 'true' }}
        run: pnpm build
