# Live mode (PRD_AI_ML §12, PHASES P9-3): one new day per run from near-real-time inputs.
#
# Before enabling (Aryan):
#   1. Accept the P9-1 check (outputs/reports/live_mode_check.md).
#   2. Build and upload the live kit: python -m oceanscope_ml.live kit ... --upload,
#      and set live.kit_repo in ml/configs/live.yaml.
#   3. Add the repository secrets below (Settings > Secrets and variables > Actions).
#   4. Run it once by hand (Actions > Live > Run workflow, dry_run on, then off).
#   5. Uncomment the schedule.
#
# Any error fails the run (red). Store files go up in one commit and manifest.json after it,
# so a failed run never leaves a manifest pointing at a missing day.
name: Live

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Do everything but upload"
        type: boolean
        default: true
  # schedule:
  #   - cron: "0 6 * * *"   # daily 06:00 UTC (PRD §12); enable after P9-1 is accepted

permissions:
  contents: read

concurrency:
  group: live-mode
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: ml
    env:
      COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
      COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
      EARTHDATA_USERNAME: ${{ secrets.EARTHDATA_USERNAME }}
      EARTHDATA_PASSWORD: ${{ secrets.EARTHDATA_PASSWORD }}
      CDSAPI_URL: https://cds.climate.copernicus.eu/api
      CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Check secrets are set
        run: |
          missing=""
          for v in COPERNICUSMARINE_SERVICE_USERNAME COPERNICUSMARINE_SERVICE_PASSWORD \
                   EARTHDATA_USERNAME EARTHDATA_PASSWORD CDSAPI_KEY HF_TOKEN; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then echo "::error::Missing secrets:$missing"; exit 1; fi

      - name: Install
        run: |
          python -m pip install --upgrade pip uv
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install --system -e .

      - name: Live run
        run: |
          python -m oceanscope_ml.live run \
            --work-dir "$RUNNER_TEMP/live" \
            --log outputs/live/live_run.json \
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '--dry-run' || '' }}

      - name: Keep the run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-run-log
          path: ml/outputs/live/live_run.json
          if-no-files-found: warn
          retention-days: 90
