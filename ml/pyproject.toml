[build-system]
requires = ["setuptools>=65.0"]
build-backend = "setuptools.build_meta"

[project]
name = "oceanscope-ml"
version = "0.1.0"
description = "Machine learning pipeline for OceanScope AI subsurface temperature reconstruction"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.24.0",
    "xarray>=2024.10.0",
    "zarr>=3.0.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",
    "pyyaml>=6.0",
    "jsonschema>=4.17.0",
    "copernicusmarine>=1.0.0",
    "cdsapi>=0.7.0",
    "earthaccess>=0.9.0",
    "dask>=2024.1.0",
    "netCDF4>=1.6.0",
    "Pillow>=10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.5.0",
    "ruff>=0.1.0",
    "types-PyYAML",
    "types-jsonschema",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = [
    "xarray.*",
    "zarr.*",
    "scipy.*",
    "pandas.*",
    "pyarrow.*",
    "copernicusmarine.*",
    "cdsapi.*",
    "earthaccess.*",
    "sklearn.*",
    "torch.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
